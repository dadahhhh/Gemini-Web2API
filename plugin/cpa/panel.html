<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini 网页账号</title>
<style>body{font:15px system-ui;max-width:1100px;margin:32px auto;padding:0 18px;background:#f5f7fa;color:#18212f}section{background:white;border:1px solid #dce1ea;border-radius:12px;padding:20px;margin:18px 0}input,textarea,button{font:inherit;padding:9px;box-sizing:border-box;margin:5px 0}input,textarea{width:100%}button{cursor:pointer;border:1px solid #c5cedb;border-radius:6px;background:#fff;margin-right:6px}button:disabled{opacity:.5}small,.muted{color:#566477}pre,#result{white-space:pre-wrap;overflow-wrap:anywhere}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e5e9f0;vertical-align:top}td:first-child{overflow-wrap:anywhere;min-width:150px}td:last-child{min-width:210px}.notice{background:#eef4ff;padding:12px;border-radius:6px}details{max-width:300px}.danger{color:#ab2531}label{display:block;margin-top:10px}</style>
<h1>Gemini 网页账号</h1><p>添加多个 Google 账号，共用同一个模型调用地址。</p>
<section><label>CPA 管理密钥<input id="key" type="password" autocomplete="off"></label><small>使用管理密钥，仅保存在当前页面内存中。</small><br><button id="status">连接并刷新</button><label><input id="auto" type="checkbox" checked style="width:auto"> 每 5 秒刷新状态</label><p id="summary" role="status">尚未连接</p><p id="routing" class="notice">就绪且支持所选模型的账号参与分流；冷却或停用的账号会被跳过。</p><div class="table"><table><thead><tr><th>账号</th><th>状态 / 并发</th><th>模型 / 冷却</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div></section>
<section id="editor"><h2 id="title">新增账号</h2><p id="modeHint">新增不会覆盖已有账号。更新 Cookie 请在账号列表中选择“更新凭证”。</p><label>账号名称（选填）<input id="account" placeholder="留空自动生成，不同账号分别保存" autocomplete="off"></label><label>Google 账号序号（选填）<input id="authUser" type="number" min="0" max="99" placeholder="通常留空；同一浏览器多账号对应官网 /u/0/、/u/1/"></label><label>选择导出文件（最多 10 个）<input id="file" type="file" accept=".json,.txt" multiple></label><p id="selection" class="muted"></p><label>或粘贴一个账号的 Cookie / JSON<textarea id="material" rows="7" placeholder="自动识别 Cookie Header、Cookie JSON 数组、StorageState；每份文件代表一个账号"></textarea></label><button id="import">新增并验证</button><button id="cancel" hidden>取消更新</button><p id="result" role="status"></p><small>文件批量导入仅新增。同一浏览器的多个 Google 账号请逐个填写官网对应的账号序号。保存后需等待账号变为“就绪”。</small></section>
<script>
const id=x=>document.getElementById(x),base='/v0/management/plugins/dadahhhh-gemini-web/';
let mode='create',connected=false,refreshing=false;
const states={ready:'就绪',cooldown:'冷却中',initializing:'验证中',disabled:'已停用',auth_required:'需要重新登录',unavailable:'暂不可用'};
async function api(path,body){const key=id('key').value.trim();if(!key)throw Error('请先填写 CPA 管理密钥');const r=await fetch(base+path,{method:body?'POST':'GET',credentials:'omit',cache:'no-store',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data;try{data=await r.json()}catch{throw Error('接口返回异常，请刷新页面后重试')}if(!r.ok){if(r.status===401){connected=false;throw Error('管理鉴权失败：请使用 CPA 管理密钥，不是模型 API Key')}if(r.status===403)throw Error('管理接口拒绝访问，请核对管理端访问设置');throw Error((typeof data.error==='string'?data.error:data.error?.message)||'请求失败（'+r.status+'）')}return data}
const node=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
const date=x=>x?new Date(x).toLocaleString():'—';
function reset(){mode='create';id('title').textContent='新增账号';id('modeHint').textContent='新增不会覆盖已有账号。更新 Cookie 请在账号列表中选择“更新凭证”。';id('account').readOnly=false;id('account').value='';id('authUser').value='';id('file').value='';id('file').multiple=true;id('selection').textContent='';id('material').value='';id('import').textContent='新增并验证';id('cancel').hidden=true}
function edit(account){reset();mode='update';id('title').textContent='更新账号凭证';id('modeHint').textContent='仅更新所选账号，保留原有启停状态和代理设置。';id('account').value=account.id;id('account').readOnly=true;id('file').multiple=false;id('import').textContent='更新并验证';id('cancel').hidden=false;id('editor').scrollIntoView({behavior:'smooth'});id('material').focus()}
function render(s){id('summary').textContent=`版本 ${s.version} · 总账号 ${s.total} · 可用 ${s.available} · 冷却 ${s.cooling_down} · 停用 ${s.disabled}`;const strategy=s.routing_strategy==='fill-first'?'依次优先使用':'轮询';id('routing').textContent=`分流策略：${strategy}；每账号并发 ${s.per_account_concurrency}。仅就绪且支持所选模型的账号参与调度；冷却、停用账号会被跳过，同一会话会优先沿用原账号。`;id('accounts').replaceChildren();for(const a of s.accounts||[]){const tr=node('tr'),name=node('td',a.id);name.append(node('p','最近使用：'+date(a.last_used),'muted'));const state=node('td');state.append(node('strong',states[a.state]||a.state),node('p',`进行中 ${a.pending} / ${s.per_account_concurrency}`));if(a.hint)state.append(node('p',a.hint,'muted'));const models=node('td'),details=node('details');details.append(node('summary',`支持 ${a.models?.length||0} 个模型`),node('pre',(a.models||[]).join('\n')));models.append(details);if(a.cooldown_until)models.append(node('p','账号冷却至 '+date(a.cooldown_until)));for(const c of a.model_cooldowns||[])models.append(node('p',`${c.model} 冷却至 ${date(c.until)}`));const actions=node('td');for(const [label,action] of [['更新凭证','edit'],[a.enabled?'停用':'启用',a.enabled?'disable':'enable'],['重新验证','verify'],['删除','remove']]){const b=node('button',label,action==='remove'?'danger':'');b.disabled=action==='verify'&&!a.enabled;b.onclick=()=>act(a,action,b);actions.append(b)}tr.append(name,state,models,actions);id('accounts').append(tr)}if(!s.accounts?.length){const tr=node('tr'),td=node('td','还没有账号，请在下方新增。');td.colSpan=4;tr.append(td);id('accounts').append(tr)}}
async function refresh(){if(refreshing)return;refreshing=true;try{render(await api('status'));connected=true}catch(e){id('summary').textContent=e.message}finally{refreshing=false}}
async function act(account,action,button){if(action==='edit'){edit(account);return}if(action==='remove'&&!confirm('删除账号 '+account.id+' 及其本地登录凭证？'))return;button.disabled=true;try{await api('account',{id:account.id,action});id('result').textContent='账号操作已完成';await refresh()}catch(e){id('result').textContent=e.message}finally{button.disabled=false}}
id('status').onclick=refresh;id('cancel').onclick=reset;id('key').oninput=()=>{connected=false};
id('file').onchange=()=>{const files=[...id('file').files];id('selection').textContent=files.map(f=>f.name).join('、');if(files.length)id('material').value=''};
id('material').oninput=()=>{if(id('material').value){id('file').value='';id('selection').textContent=''}};
id('import').onclick=async()=>{const button=id('import');button.disabled=true;id('result').textContent='正在保存…';try{const files=[...id('file').files];if(files.length>10)throw Error('一次最多选择 10 个文件');if(mode==='update'&&files.length>1)throw Error('更新凭证时只能选择一个文件');if(files.reduce((n,f)=>n+f.size,0)>3*1024*1024)throw Error('所选文件总大小超过 3 MiB');if(files.length>1){if(id('account').value.trim()||id('authUser').value!=='')throw Error('批量导入时请留空账号名称和序号；需要指定序号时请逐个导入');const accounts=await Promise.all(files.map(async f=>({material:await f.text()}))),body={accounts};if(new TextEncoder().encode(JSON.stringify(body)).length>4*1024*1024)throw Error('批量请求超过 4 MiB，请分批导入');const r=await api('import-batch',body),report=`已保存 ${r.saved} 个，失败 ${r.failed} 个。\n`+r.results.map(x=>`${files[x.index].name}：${x.saved?'已保存 '+x.id:x.error.message}`).join('\n');reset();id('result').textContent=report}else{const body={material:files.length?await files[0].text():id('material').value,id:id('account').value.trim(),mode};if(id('authUser').value!=='')body.auth_user=Number(id('authUser').value);const r=await api('import',body);reset();id('result').textContent=`${r.id}：${r.message}`}await refresh()}catch(e){id('result').textContent=e.message}finally{button.disabled=false}};
setInterval(()=>{if(connected&&id('auto').checked&&!document.hidden)refresh()},5000);
</script></html>
