<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini 网页账号</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#18212f}section{background:white;border:1px solid #dce1ea;border-radius:12px;padding:20px;margin:18px 0}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box;margin:6px 0}input,textarea{width:100%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#566477}</style>
<h1>Gemini 网页账号</h1><p>Cookie 字符串、Cookie JSON 数组、StorageState 均可自动识别。</p>
<section><label>CPA 管理密钥<input id="key" type="password" autocomplete="off"></label><small>使用管理密钥，区别于调用模型的 API Key；仅保存在当前页面内存中。</small><br><button id="status">刷新账号状态</button><pre id="output">尚未查询</pre></section>
<section><h2>导入账号</h2><label>账号名称（选填）<input id="account" placeholder="留空将自动生成，例如 gemini-pro" autocomplete="off"></label><label>选择导出文件（选填）<input id="file" type="file" accept=".json,.txt"></label><textarea id="material" rows="7" placeholder="粘贴 Cookie Header、Cookie 数组或 StorageState JSON，无需手动选择格式"></textarea><button id="import">保存并验证账号</button><p id="result" role="status"></p></section>
<script>
const id=x=>document.getElementById(x),base='/v0/management/plugins/dadahhhh-gemini-web/';
async function api(path,body){const key=id('key').value;if(!key)throw Error('请先填写 CPA 管理密钥');const r=await fetch(base+path,{method:body?'POST':'GET',credentials:'omit',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data;try{data=await r.json()}catch{throw Error('接口返回异常，请刷新页面后重试')}if(!r.ok){if(r.status===401)throw Error('管理鉴权失败：请使用 CPA 管理密钥，不是模型 API Key');if(r.status===403)throw Error('管理接口拒绝访问，请核对管理端访问设置');const message=typeof data.error==='string'?data.error:data.error?.message;throw Error(message||'请求失败（'+r.status+'）')}return data}
async function refresh(){try{id('output').textContent=JSON.stringify(await api('status'),null,2)}catch(e){id('output').textContent=e.message}}
id('status').onclick=refresh;
id('file').onchange=async()=>{const f=id('file').files[0];if(!f)return;if(f.size>3*1024*1024){id('result').textContent='文件超过 3 MiB，请精简导出内容';return}id('material').value=await f.text()};
id('import').onclick=async()=>{const button=id('import');button.disabled=true;id('result').textContent='正在保存…';try{const r=await api('import',{material:id('material').value,id:id('account').value});id('material').value='';id('file').value='';id('account').value=r.id;id('result').textContent=r.message||'已保存，请刷新状态查看验证结果';await refresh()}catch(e){id('result').textContent=e.message}finally{button.disabled=false}};
</script></html>
