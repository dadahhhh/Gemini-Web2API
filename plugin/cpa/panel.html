<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini 网页账号</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#18212f}section{background:white;border:1px solid #dce1ea;border-radius:12px;padding:20px;margin:18px 0}input,textarea,button,select{font:inherit;padding:10px;box-sizing:border-box;margin:6px 0}input,textarea{width:100%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#566477}</style>
<h1>Gemini 网页账号</h1><p>导入 Gemini 网页 Cookie 或 StorageState 后，通过 <code>gemini-web/</code> 模型调用。</p>
<section><label>CPA 管理密钥<input id="key" type="password" autocomplete="off"></label><small>密钥仅保存在当前页面内存中，关闭页面即清除。</small><br><button id="status">刷新账号状态</button><pre id="output">尚未查询</pre></section>
<section><h2>导入账号</h2><select id="kind"><option value="cookie">Cookie 字符串 / Cookie 导出</option><option value="state">StorageState JSON</option></select><textarea id="material" rows="7" placeholder="在这里粘贴，内容不会显示在状态结果中"></textarea><button id="import">导入账号</button><p id="result" role="status"></p></section>
<script>
const id=x=>document.getElementById(x);
const base='/v0/management/plugins/dadahhhh-gemini-web/';
async function api(path,body){const key=id('key').value;if(!key)throw Error('请先填写 CPA 管理密钥');const r=await fetch(base+path,{method:body?'POST':'GET',credentials:'omit',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data;try{data=await r.json()}catch{throw Error('接口返回异常，请核对 CPA 版本')}if(!r.ok)throw Error(data.error||'请求失败（'+r.status+'）');return data}
id('status').onclick=async()=>{try{id('output').textContent=JSON.stringify(await api('status'),null,2)}catch(e){id('output').textContent=e.message}};
id('import').onclick=async()=>{id('result').textContent='正在导入…';try{const value=id('material').value;const body=id('kind').value==='state'?{storage_state:JSON.parse(value)}:{cookie:value};await api('import',body);id('material').value='';id('result').textContent='导入成功，请刷新账号状态查看初始化结果。'}catch(e){id('result').textContent=e.message}};
</script></html>
